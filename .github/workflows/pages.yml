name: craft-conductor-project-site

# This is the ONLY workflow permitted to publish the entire Pages artifact.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "testing/**"
      - "tools/real_world_tests.py"
      - "tools/build_website_demo.py"
      - "tools/select_website_release.py"
      - "tests/test_website_demo_e2e.py"
      - ".github/demo-release-policy.json"
      - "src/craft_conductor/webui/icon.png"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install pytest playwright qrcode
          python -m playwright install --with-deps chromium
      - name: Choose latest published release
        id: selected
        env:
          ${{ github.token }}: ${{ github.token }}
        run: python tools/select_website_release.py --github-output "$GITHUB_OUTPUT"
      - name: Extract exact tagged application frontend
        env:
          VERSION_TAG: ${{ steps.selected.outputs.tag }}
        run: |
          git fetch --depth=1 origin tag "$VERSION_TAG"
          mkdir -p "$RUNNER_TEMP/release-source"
          git archive "$VERSION_TAG" src/craft_conductor/webui/ | tar -x -C "$RUNNER_TEMP/release-source"
          test -f "$RUNNER_TEMP/release-source/src/craft_conductor/webui/app.js"
      - name: Assemble full website
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp src/craft_conductor/webui/icon.png _site/icon.png
          python tools/real_world_tests.py verify
          python tools/real_world_tests.py publish --output _site/testing/data
          test -s _site/index.html
          test -f _site/join/index.html
          test -f _site/testing/index.html
          test -f _site/googlef2c4a8b5e575e76a.html
      - name: Build real application demo for tagged release
        env:
          CC_VERSION: ${{ steps.selected.outputs.version }}
          CC_CHANNEL: ${{ steps.selected.outputs.channel }}
        run: |
          python tools/build_website_demo.py \
            --source "$RUNNER_TEMP/release-source/src/craft_conductor/webui" \
            --output _site/demo --version "$CC_VERSION" --channel "$CC_CHANNEL"
      - name: Validate code and interactive site
        run: |
          node --check site/website.js
          node --check _site/demo/mock-api.js
          node --check _site/demo/assets/app.js
          python -m pytest tests/test_project_website.py -q
          python tools/check_demo_contract.py
          python -m pytest tests/test_website_release_policy.py -q
          python -m pytest tests/test_website_demo_e2e.py -q
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
