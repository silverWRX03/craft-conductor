name: craft-conductor project site
# One Pages publisher owns the COMPLETE artifact, including testing and join routes.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "testing/**"
      - "tools/real_world_tests.py"
      - "tools/build_public_site.py"
      - "src/craft_conductor/webui/icon.png"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install site and browser validation dependencies
        run: |
          python -m pip install "qrcode==8.2"
          npm install --prefix .site-test --no-save "playwright@1.56.1"
          .site-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Select latest published release matching demo policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/cc-releases.json"
          python - "$RUNNER_TEMP/cc-releases.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          channel=json.loads(Path("site/demo-channel.json").read_text())["release_channel"]
          if channel not in ("all","stable"):
              raise SystemExit("Invalid release channel")
          releases=json.loads(Path(sys.argv[1]).read_text())
          def stable(r):
              # Older releases are explicitly named "(beta)" but may have prerelease=false.
              label=(r.get("name") or "").lower()
              tag=(r.get("tag_name") or "").lower()
              return (not r["prerelease"] and "beta" not in label
                  and "(rc)" not in label and "(alpha)" not in label
                  and "pre-release" not in label
                  and not any(x in tag for x in ("alpha", "beta", "-rc")))
          eligible=[r for r in releases if not r["draft"] and (channel=="all" or stable(r))]
          if not eligible:
              raise SystemExit("No published release. Existing Pages site is left unchanged")
          release=max(eligible,key=lambda x:x.get("published_at") or x.get("created_at") or "")
          tag=release["tag_name"]
          if not tag or not all(c.isalnum() or c in ".-_+" for c in tag):
              raise SystemExit("Unsafe release tag")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write("CC_DEMO_TAG="+tag+"\n")
          print("Building demo for:",tag,"release policy:",channel)
          PY
      - name: Extract real application assets from published tag
        shell: bash
        run: |
          mkdir -p _release
          git fetch --force --depth=1 origin "refs/tags/$CC_DEMO_TAG:refs/tags/$CC_DEMO_TAG"
          git archive "refs/tags/$CC_DEMO_TAG" src/craft_conductor/webui | tar -x -C _release
          test -s _release/src/craft_conductor/webui/app.js
      - name: Build ALL public pages (never replace only testing or demo)
        run: python tools/build_public_site.py --ui-root _release/src/craft_conductor/webui --output _site --version "$CC_DEMO_TAG"
      - name: Validate static Pages build before publishing
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_public_site.py
          node --check _site/demo/app.js
          node --check _site/demo/demo-runtime.js
          node --check _site/home.js
          test -s _site/testing/index.html
          test -s _site/join/index.html
          test -s _site/googlef2c4a8b5e575e76a.html
      - name: Browser validation of exact release before deployment
        run: node tools/smoke_public_site.cjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
