name: pages

# The ONLY workflow that publishes GitHub Pages: the whole site at once (the homepage, the invite
# page join/, the real-world testing dashboard testing/ with its data, Google's verification file,
# and the interactive demo of the newest published release). website-build.yml puts it together and
# tests it; nothing is published unless every check passes, so a failure leaves the live site as it was.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" (once).
#
# When it runs:
#   - after each release (release.yml calls it once the release and its downloads exist; a release
#     made by release.yml doesn't send the "release published" event itself, so it's called);
#   - when a release is published by hand on GitHub;
#   - on main, when the website, the testing records or the demo change;
#   - by hand (Run workflow).
# Which release the demo shows: .github/demo-release-policy.json (docs/website.md).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "testing/**"
      - "tools/real_world_tests.py"
      - "tools/build_website.py"
      - "tools/select_website_release.py"
      - "tools/check_demo_contract.py"
      - "tests/test_website*.py"
      - "tests/ui_website*.cjs"
      - "tests/demo_contract.cjs"
      - ".github/demo-release-policy.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/website-build.yml"
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false  # (a release's run is never dropped for a later one: they queue)

jobs:
  build:
    uses: ./.github/workflows/website-build.yml
    with:
      pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Summary
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Published $URL, with the demo of Craft Conductor $VERSION ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
