name: wiki

# The wiki is made from the repository: the user manual (src/craft_conductor/webui/manual.md) split into
# pages with the app's screenshots (src/craft_conductor/webui/screenshots), plus the hand-written pages
# in wiki/ (see packaging/wiki.py). Edit those files, not the wiki: this publishes them on every change
# to main (pages written on the wiki itself and not made here are left alone).

on:
  push:
    branches: [main]
    paths: ["src/craft_conductor/webui/manual.md", "src/craft_conductor/webui/screenshots/**", "wiki/**",
            "packaging/wiki.py", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write   # (the wiki is a git repository next to this one)

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pages
        run: python packaging/wiki.py wiki-out
      - name: Publish them to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          # Pictures this used to publish and no longer does (friend-setup.png has the retired name).
          rm -f wiki-repo/images/friend-setup.png wiki-repo/images/help-mobile.png wiki-repo/images/manual.png \
            wiki-repo/images/readiness-day.png wiki-repo/images/settings-day.png
          cp -r wiki-out/. wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is up to date."; exit 0; fi
          git commit -m "Update from ${GITHUB_SHA::7}: the user manual and the wiki pages"
          git push
