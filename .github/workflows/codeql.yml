# CodeQL code scanning: the Python program, the web pages' JavaScript (and the mod-conflict
# relay), and these workflows themselves. Findings appear under Security → Code scanning.
# (If the repository's Settings → Code security → CodeQL "Default setup" is on, switch it off:
# GitHub refuses results from this workflow while it's on.)
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"   # Wednesdays: new queries find old problems too
  workflow_dispatch:

# Share a group only for the same PR; keep all other scans independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # (to upload the results)
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
