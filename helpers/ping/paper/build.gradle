plugins {
    id 'java'
}

// The helper's own version (the jar is craft_conductor_ping-paper-<version>.jar).
version = '1.0.0'

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Compiled against the oldest supported API; nothing is bundled into the jar.
    compileOnly 'io.papermc.paper:paper-api:1.17.1-R0.1-SNAPSHOT'
}

// The file writing the helpers share.
sourceSets.main.java.srcDir '../common/src/main/java'

tasks.withType(JavaCompile).configureEach {
    options.release = 16
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
        // (the same bytes from a Windows checkout, whose text files may end lines in CRLF)
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'))
    }
}

jar {
    archiveBaseName = 'craft_conductor_ping-paper'
    // Reproducible: the same source gives the same bytes on any computer.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    filePermissions { unix('rw-r--r--') }
    dirPermissions { unix('rwxr-xr-x') }
}
